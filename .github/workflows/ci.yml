name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Game logic tests (browser edition)
        run: npm test
      - name: JavaScript syntax check
        run: npm run check
      - name: Python edition compiles
        run: python -m py_compile python_app/main.py
